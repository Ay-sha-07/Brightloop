{% extends "base.html" %}
{% block title %}Set new password · Brightloop{% endblock %}
{% block auth %}
<div class="auth-page">
  <div class="auth-card">
    <h1>Set new password</h1>
    <p class="sub">Choose a strong password for your account.</p>
    {% if error %}<div class="error-box">{{ error }}</div>{% endif %}
    <form method="post" action="/reset-password/{{ token }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="field">
        <label for="password">New password</label>
        <input type="password" id="password" name="password" required minlength="9">
      </div>
      <div class="field">
        <label for="password2">Confirm password</label>
        <input type="password" id="password2" name="password2" required minlength="9">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">Update password</button>
    </form>
  </div>
</div>
{% endblock %}
